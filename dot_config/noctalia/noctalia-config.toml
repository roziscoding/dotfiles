[plugin_settings."aristides/udiskie"]
manager_open_near_click = true
manager_placement = "attached"

[plugin_settings."blackbartblues/audio-switcher"]
show_notification_on_switch = false

[plugins]
enabled = [
    "noctalia/wallhaven",
    "yuuto/arch-updater",
    "aristides/udiskie",
    "blackbartblues/audio-switcher",
    "noctalia/world_clock",
    "dotnetrob/cat"
]

[shell]
avatar_path = "/home/roziscoding/Pictures/profile.jpg"
clipboard_enabled = false
polkit_agent = true
settings_show_advanced = false

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    transparency_mode = "glass"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "Alt+l"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    command = "hyprshutdown -p 'Logging out…'"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    command = "hyprshutdown -t 'Rebooting…' -p 'systemctl reboot'"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    command = "hyprshutdown -t 'Powering off…' -p 'systemctl poweroff'"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [shell.shadow]
    direction = "down_left"

[theme]
community_palette = "Rosey AMOLED"
custom_palette = "wallhaven-gw9rv3-rb"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "qt", "starship" ]
    community_ids = [
        "spicetify",
        "pywalfox",
        "discord",
        "telegram",
        "neovim",
        "vscode",
        "steam",
        "vicinae",
        "hyprtoolkit",
        "bat",
        "yazi"
    ]

[wallpaper]
directory = "/home/roziscoding/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/roziscoding/Pictures/Wallpapers/wallhaven-3qwqkv.jpg"

    [wallpaper.last]
    path = "/home/roziscoding/Pictures/Wallpapers/wallhaven-3qwqkv.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/roziscoding/Pictures/Wallpapers/wallhaven-3qwqkv.jpg"

[widget.audio_visualizer]
centered = false
color_2 = "on_primary"
mirrored = false
show_when_idle = true

[widget.bar]
type = "noctalia/world_clock:bar"

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.cat_2]
poll_interval = 1
run_threshold = 50
show_cpu_percent = true
type = "dotnetrob/cat:cat"

[widget.center_separator_1]
glyph = ""
label = "|"
type = "custom_button"

[widget.center_separator_2]
glyph = ""
label = "|"
type = "custom_button"

[widget.clock]
format = "{:%D %H:%M}"

[widget.control-center]
capsule_padding = 0
glyph = "user-square"

[widget.gpu_usage]
type = "custom_button"

[widget.media]
capsule = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.privacy]
capsule = true
hide_inactive = true

[widget.ram]
display = "text"
visualization = "none"

[widget.status]
hide_when_empty = true
type = "aristides/udiskie:status"

[widget.sysmon]
stat = "gpu_vram"

[widget.temp]
display = "text"
visualization = "none"

[widget.username]
glyph = "user-square"
label = "roziscoding"
type = "custom_button"

    [widget.username.actions]
    left = "exec noctalia msg panel-toggle control-center"

[widget.wallhaven]
glyph = "photo-search"
type = "noctalia/wallhaven:wallhaven"

[widget.widget]
hide_on_empty = true
type = "yuuto/arch-updater:widget"

    [widget.widget.actions]
    left = "exec ghostty -e paru"

[widget.widget_2]
type = "blackbartblues/audio-switcher:widget"

[widget.workspaces]
label_source = "name"
max_label_chars = 20
