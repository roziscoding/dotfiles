[bar.default]
background_opacity = 0.79999998211860657
center = [ "group:g1" ]
end = [ "media", "privacy", "group:g2", "group:g3", "session" ]
margin_ends = 10
start = [ "workspaces", "wallpaper", "wallhaven", "audio_visualizer" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "cat_2", "ram", "temp", "widget" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "tray", "status", "notifications", "widget_2" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "username", "center_separator_1", "clock", "bar", "center_separator_2", "weather" ]
    opacity = 1.0
    padding = 6.0

[control_center]
hidden_tabs = [ "media", "audio", "monitor", "power", "network", "weather", "calendar", "notifications" ]
